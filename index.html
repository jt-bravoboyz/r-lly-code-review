<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Rally your squad. Track your crew. Get everyone home safe. Plan nights out with designated drivers, live tracking, and group coordination." />

    <meta property="og:title" content="R@lly — The app for nights that matter" />
    <meta property="og:description" content="Rally your squad. Track your crew. Get everyone home safe. 🎯" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/rally-icon-192.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@RallyApp" />
    <meta name="twitter:title" content="R@lly — The app for nights that matter" />
    <meta name="twitter:description" content="Rally your squad. Track your crew. Get everyone home safe. 🎯" />
    <meta name="twitter:image" content="/rally-icon-192.png" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/rally-icon-192-v6.png" />
    <link rel="preload" as="image" href="/rally-icon-192-v6.png" fetchpriority="high" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F47A19" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
      #rally-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #050505;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 250ms ease-out;
      }
      #rally-boot-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(244,122,25,0.18) 0%, transparent 60%);
        pointer-events: none;
        animation: rally-boot-breathe 2.2s ease-in-out infinite;
      }
      #rally-boot-splash .rally-boot-stage {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #rally-boot-splash .rally-boot-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
        border-radius: 9999px;
        border: 1px solid #F47A19;
        box-shadow: 0 0 8px rgba(244,122,25,0.5);
        transform: scale(0.5);
        opacity: 0;
        will-change: transform, opacity;
      }
      #rally-boot-splash .rally-boot-flag {
        position: relative;
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 6px 18px rgba(244,122,25,0.45));
      }
      @media (prefers-reduced-motion: no-preference) {
        #rally-boot-splash .rally-boot-ring {
          animation: rally-boot-pulse 3.6s ease-out infinite;
        }
        #rally-boot-splash .rally-boot-ring.r2 { animation-delay: 1.2s; }
        #rally-boot-splash .rally-boot-ring.r3 { animation-delay: 2.4s; }
        #rally-boot-splash .rally-boot-flag {
          animation: rally-boot-flag-breathe 2.4s ease-in-out infinite;
        }
        @keyframes rally-boot-pulse {
          0%   { transform: scale(0.5); opacity: 0.9; }
          80%  { opacity: 0; }
          100% { transform: scale(2.2); opacity: 0; }
        }
        @keyframes rally-boot-breathe {
          0%, 100% { opacity: 0.7; }
          50%      { opacity: 1; }
        }
        @keyframes rally-boot-flag-breathe {
          0%, 100% { transform: scale(0.98); }
          50%      { transform: scale(1.04); }
        }
      }
      body.rally-booted #rally-boot-splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
