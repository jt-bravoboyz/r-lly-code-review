<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>R@lly — The App for Nights That Matter</title>
    <meta name="description" content="Rally your squad. Track your crew. Get everyone home safe. Plan nights out with designated drivers, live tracking, and group coordination." />
    <meta name="author" content="Bravo Boyz LLC" />

    <meta property="og:title" content="R@lly — The app for nights that matter" />
    <meta property="og:description" content="Rally your squad. Track your crew. Get everyone home safe. 🎯" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/rally-icon-192.png" />

    <script>
      (function () {
        if (location.pathname !== '/share-preview') return;
        var params = new URLSearchParams(location.search);
        var to = params.get('to') || 'https://rlly.cloud/';
        var type = params.get('type') || 'event';
        var id = params.get('id') || '';
        var title = type === 'tab' ? 'Split this tab — R@lly' : "You're invited — R@lly";
        var description = 'Nights That Matter. Tap to RSVP.';
        var image = id
          ? 'https://lovzfxppnxictkvymyot.functions.supabase.co/render-event-og-image?' + (type === 'tab' ? 'tab=' : 'id=') + encodeURIComponent(id)
          : 'https://rlly.cloud/rally-icon-512.png';
        function meta(attr, name, content) {
          document.write('<meta ' + attr + '="' + name + '" content="' + String(content).replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '">');
        }
        document.write('<title>' + title + '</title>');
        meta('name', 'description', description);
        meta('property', 'og:type', 'website');
        meta('property', 'og:site_name', 'R@lly');
        meta('property', 'og:title', title);
        meta('property', 'og:description', description);
        meta('property', 'og:url', to);
        meta('property', 'og:image', image);
        meta('property', 'og:image:width', '1200');
        meta('property', 'og:image:height', '630');
        meta('name', 'twitter:card', 'summary_large_image');
        meta('name', 'twitter:title', title);
        meta('name', 'twitter:description', description);
        meta('name', 'twitter:image', image);
      })();
    </script>

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@RallyApp" />
    <meta name="twitter:title" content="R@lly — The app for nights that matter" />
    <meta name="twitter:description" content="Rally your squad. Track your crew. Get everyone home safe. 🎯" />
    <meta name="twitter:image" content="/rally-icon-192.png" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/rally-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F47A19" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
