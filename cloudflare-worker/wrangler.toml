name = "rlly-share-unfurl"
main = "src/index.ts"
compatibility_date = "2025-05-01"
workers_dev = true
# Deploy trigger: v4 (force redeploy — unfurl header still missing 2026-05-20)

# Routes bind the Worker to rlly.cloud share paths.
# The rlly.cloud zone must exist in the same Cloudflare account as the
# CLOUDFLARE_API_TOKEN used to deploy.
routes = [
  { pattern = "rlly.cloud/join/*",   zone_name = "rlly.cloud" },
  { pattern = "rlly.cloud/events/*", zone_name = "rlly.cloud" },
]
